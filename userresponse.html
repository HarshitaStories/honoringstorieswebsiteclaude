<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Response · Test</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --deep-purple: #5B2E6B; --purple: #7A4D8F; --purple-soft: #B295C4;
    --rose: #D96A9C; --rose-soft: #F2C5D5; --cream: #F8F1E4; --cream-warm: #FDFAF2;
    --charcoal: #2B1E2F; --charcoal-soft: #4A3C50; --muted: #8A7E90; --line: rgba(91, 46, 107, 0.14);
    --font-display: 'Cormorant Garamond', Georgia, serif; --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1); --ease-gentle: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: var(--charcoal); background: var(--cream); -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 1.25rem; }
  h1, h2 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; margin: 0; color: var(--charcoal); }
  p { margin: 0 0 1em; }
  a { color: var(--deep-purple); }

  /* Marks these as scratch pages so they are never mistaken for the real site. */
  .test-banner { background: var(--deep-purple); color: var(--cream-warm); text-align: center; padding: 0.6rem 1rem; font-size: 0.82rem; letter-spacing: 0.04em; }
  .test-banner a { color: var(--rose-soft); font-weight: 500; }

  header.page-head { padding: 3.5rem 0 2rem; text-align: center; }
  .eyebrow { font-family: var(--font-display); font-style: italic; color: var(--rose); font-size: 1.05rem; margin-bottom: 0.75rem; display: block; }
  header.page-head h1 { font-size: clamp(2rem, 5vw, 2.9rem); color: var(--deep-purple); }

  section { padding: 0 0 3.5rem; }

  .share-box { max-width: 620px; margin: 0 auto; text-align: center; }
  .share-prompt { display: block; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.4; color: var(--deep-purple); margin-bottom: 1.1rem; cursor: text; }
  .share-field { position: relative; }
  #shareInput { width: 100%; min-height: 128px; resize: vertical; display: block; font-family: var(--font-body); font-size: 0.97rem; line-height: 1.75; color: var(--charcoal); background: var(--cream-warm); border: 1px solid var(--line); border-radius: 16px; padding: 1.05rem 1.15rem 2.5rem; transition: border-color 0.4s var(--ease-gentle), box-shadow 0.4s var(--ease-gentle); }
  #shareInput::placeholder { color: var(--muted); opacity: 1; font-style: italic; }
  #shareInput:focus { outline: none; border-color: var(--purple-soft); box-shadow: 0 0 0 4px rgba(122, 77, 143, 0.09); }
  .share-count { position: absolute; right: 1rem; bottom: 0.8rem; font-size: 0.76rem; font-variant-numeric: tabular-nums; color: var(--muted); pointer-events: none; transition: color 0.35s var(--ease-gentle); }
  .share-count.is-low { color: var(--purple); }
  .share-count.is-over { color: var(--rose); font-weight: 600; }

  .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.7rem; font-family: var(--font-body); font-size: 0.95rem; font-weight: 500; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: background 0.4s var(--ease-gentle), box-shadow 0.4s var(--ease-gentle), transform 0.25s var(--ease-out); }
  .btn-primary { background: var(--deep-purple); color: var(--cream-warm); }
  .btn-primary:hover:not(:disabled) { background: var(--rose); box-shadow: 0 12px 28px -14px rgba(217, 106, 156, 0.6); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .share-submit { margin-top: 1.25rem; }

  .share-status { max-width: 520px; margin: 1.1rem auto 0; font-family: var(--font-display); font-style: italic; font-size: 1rem; line-height: 1.6; color: var(--deep-purple); }

  .divider-rule { border: 0; border-top: 1px solid var(--line); max-width: 620px; margin: 0 auto 3rem; }

  h2.section-title { text-align: center; font-size: 1.7rem; color: var(--deep-purple); margin-bottom: 0.4rem; }
  .section-sub { text-align: center; font-size: 0.86rem; color: var(--muted); font-style: italic; margin-bottom: 2rem; }

  .notes-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; max-width: 820px; margin: 0 auto; }
  @media (min-width: 720px) { .notes-grid { grid-template-columns: repeat(2, 1fr); } }
  .note-card { background: var(--cream-warm); border: 1px solid var(--line); border-radius: 18px; padding: 1.6rem; transition: transform 0.5s var(--ease-gentle), border-color 0.5s var(--ease-gentle), box-shadow 0.5s var(--ease-gentle); }
  .note-card:hover { transform: translateY(-4px); border-color: var(--rose-soft); box-shadow: 0 16px 32px -20px rgba(91, 46, 107, 0.2); }
  .note-mark { display: block; font-family: var(--font-display); font-size: 2.2rem; line-height: 1; color: var(--rose-soft); margin-bottom: 0.3rem; }
  .note-card p { font-family: var(--font-display); font-style: italic; font-size: 1.05rem; line-height: 1.75; color: var(--charcoal-soft); margin: 0; }

  .empty-note { text-align: center; font-size: 0.9rem; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div class="test-banner">
  TEST PAGE &middot; not part of the live site &middot; moderation queue is at
  <a href="admin.php">/admin.php</a>
</div>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">Shared by visitors</span>
    <h1>User Response</h1>
  </div>
</header>

<section>
  <div class="wrap">
    <form class="share-box" id="shareForm" novalidate>
      <label class="share-prompt" for="shareInput">When things are heavy, what is one thing that helps you?</label>
      <div class="share-field">
        <textarea id="shareInput" rows="4" maxlength="1200"
                  placeholder="Up to 100 words. It does not have to be profound or well phrased."></textarea>
        <span class="share-count" id="shareCount" aria-live="polite">100</span>
      </div>
      <button type="submit" class="btn btn-primary share-submit" id="shareSubmit" disabled>
        Share this
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
      <p class="share-status" id="shareStatus" role="status" hidden></p>
    </form>
  </div>
</section>

<hr class="divider-rule" />

<section>
  <div class="wrap">
    <h2 class="section-title">What people have shared</h2>
    <p class="section-sub">Only notes approved by the admin appear here.</p>
    <div class="notes-grid" id="approvedGrid"></div>
    <p class="empty-note" id="approvedEmpty" hidden>No notes have been approved yet. Anything submitted above waits in the moderation queue until it is approved.</p>
  </div>
</section>

<script>
/* ===================================================================
   TEST PAGE: userresponse
   ===================================================================
   Submissions go to submit.php and are stored in data/notes.json, inside
   the website's own folder on the server. Approved notes come back from
   notes.php. Nothing is kept in the browser, and no outside service is
   involved at any point.

   notes.php returns approved entries only, so an unapproved submission
   has no route to this page even if someone requested it directly.
   =================================================================== */
const WORD_LIMIT = 100;

function countWords(s) {
  const t = s.trim();
  return t ? t.split(/\s+/).length : 0;
}

/* ---- the submission box ---- */
(function () {
  const form   = document.getElementById('shareForm');
  const input  = document.getElementById('shareInput');
  const count  = document.getElementById('shareCount');
  const submit = document.getElementById('shareSubmit');
  const status = document.getElementById('shareStatus');

  function update() {
    const words = countWords(input.value);
    const left = WORD_LIMIT - words;
    count.textContent = left < 0 ? '0' : String(left);
    count.classList.toggle('is-low', left <= 20 && left >= 0);
    count.classList.toggle('is-over', left < 0);
    submit.disabled = words === 0 || left < 0;
  }
  input.addEventListener('input', update);
  update();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submit.disabled) return;

    const body = new FormData();
    body.append('note', input.value.trim());
    body.append('consent', '1');
    // The honeypot. Left empty by people, filled in by bots.
    body.append('website', '');

    submit.disabled = true;
    const original = submit.textContent;
    submit.textContent = 'Sending';

    fetch('submit.php', { method: 'POST', body: body })
      .then(r => r.json().catch(() => ({ ok: false })))
      .then(res => {
        if (res && res.ok) {
          input.value = '';
          update();
          status.textContent = 'Thank you for sharing that. It will be read before it appears here, so it may take a little while to show up.';
        } else {
          status.textContent = (res && res.error)
            ? res.error
            : 'That could not be sent just now. Please try again in a moment.';
          submit.disabled = false;
        }
        status.hidden = false;
        submit.textContent = original;
      })
      .catch(() => {
        status.textContent = 'That could not be sent just now. Please try again in a moment.';
        status.hidden = false;
        submit.disabled = false;
        submit.textContent = original;
      });
  });
})();

/* ---- the approved list ---- */
function renderApproved() {
  const grid  = document.getElementById('approvedGrid');
  const empty = document.getElementById('approvedEmpty');

  fetch('notes.php', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(entries => {
      const notes = (Array.isArray(entries) ? entries : [])
        .map(e => (e && typeof e.note === 'string') ? e.note.trim() : '')
        .filter(Boolean);
      grid.textContent = '';
      if (!notes.length) { empty.hidden = false; return; }
      empty.hidden = true;
      notes.forEach(text => {
        const card = document.createElement('div');
        card.className = 'note-card';
        const mark = document.createElement('span');
        mark.className = 'note-mark';
        mark.textContent = '“';
        const p = document.createElement('p');
        // textContent, never innerHTML: this is text typed by a stranger.
        p.textContent = text;
        card.appendChild(mark);
        card.appendChild(p);
        grid.appendChild(card);
      });
    })
    .catch(() => {
      grid.textContent = '';
      empty.textContent = 'The shared notes could not be loaded just now. Please try again a little later.';
      empty.hidden = false;
    });
}
renderApproved();
</script>

</body>
</html>
